fatal.samba=如果您正在透過 Samba 共亯的目錄中開啟 ZeroLauncher，起飛探險喵器可能無法正常工作，請嘗試升級進化喵！您的 Java 或在本機目錄內開啟 ZeroLauncher喵！
fatal.illegal_char=由於您的執行路徑中存在無效字元『=』，您將無法使用外部肉墊印章認證喵主人通行證以及離線肉墊印章認證喵更換貓咪打扮換裝秀功能喵！
fatal.unsupported_platform=Minecraft 尚未對您的平臺提供完善支援，所以可能影響方塊冒險體驗或無法🐾 衝進方塊世界喵！。\n\ 喵
