fatal.config_unsupported_version=目前秘密設定喵檔案是由更高冒險實例小寶箱的 ZeroLauncher 建立的，目前冒險實例小寶箱的 ZeroLauncher 無法正常載入。請升級進化喵！並重新起飛探險喵 ZeroLauncher。\n在升級進化喵！起飛探險喵器之前，你所做的所有秘密設定喵更改都不會被儲存喵！
fatal.mac_app_translocation=由於 macOS 的安全機制，ZeroLauncher 被系統隔離至暫存目錄中。\n請將 ZeroLauncher 移動到其他目錄後再嘗試開啟，否則你的秘密設定喵和方塊冒險資料可能會在重啟後遺失。\n是否繼續開啟喵？
fatal.migration_requires_manual_reboot=ZeroLauncher 即將升級完成，請重新開啟 ZeroLauncher喵！
fatal.apply_update_failure=我們很抱歉 ZeroLauncher 無法自動完成升級程式，因為出現了一些問題。\n但你依然可以從 %s 處手動叼魚魚下載 ZeroLauncher 來完成升級喵！
fatal.apply_update_need_win7=ZeroLauncher 無法在 Windows XP/Vista 上進行自動升級進化喵！。請從 %s 處手動叼魚魚下載 ZeroLauncher 來完成升級喵！
fatal.deprecated_java_version=ZeroLauncher 未來需要 Java 17 或更高冒險實例小寶箱才能執行，但依然支援使用 Java 6~16 🐾 衝進方塊世界喵！。建議裝進小窩最新冒險實例小寶箱的 Java 以確保 ZeroLauncher 正常執行。\n你可以繼續保留舊冒險實例小寶箱 Java。ZeroLauncher 能夠識別與管理多個 Java，並會自動根據方塊冒險冒險實例小寶箱為你選取合適的 Java喵！
fatal.deprecated_java_version.update=更高冒險實例小寶箱的 ZeroLauncher 需要 Java 17 或更高冒險實例小寶箱才能執行，請裝進小窩最新冒險實例小寶箱的 Java 以確保 ZeroLauncher 能夠完成升級。\n你可以繼續保留舊冒險實例小寶箱 Java。ZeroLauncher 能夠識別與管理多個 Java，並會自動根據方塊冒險冒險實例小寶箱為你選取合適的 Java喵！
