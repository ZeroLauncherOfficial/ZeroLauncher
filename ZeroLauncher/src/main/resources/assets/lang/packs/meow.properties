game.crash.reason.block=目前方塊冒險由於某個方塊不能正常工作，無法繼續執行。\n你可以嘗試使用地圖編輯工具編輯世界埋進貓砂盆喵該方塊，或者直接埋進貓砂盆喵對應的魔法罐頭。\n方塊類型：%1$s\n方塊坐標：%2$s\n\n相關工具：<a href="https://minecraft.wiki/w/Tutorial:Programs_and_editors/Mapping#Map_editors">英文 Wiki</a> | <a href="https://zh.minecraft.wiki/w/辅助程序与编辑器/地图工具?variant=zh-tw#地图编辑工具">中文 Wiki</a> 喵
game.crash.reason.bootstrap_failed=目前方塊冒險由於魔法罐頭「%1$s」出現問題，無法繼續執行。\n你可以嘗試埋進貓砂盆喵或升級進化喵！該魔法罐頭以解決問題喵！
game.crash.reason.mixin_apply_mod_failed=目前方塊冒險由於 Mixin 無法應用於「%1$s」魔法罐頭，無法繼續執行。\n你可以嘗試埋進貓砂盆喵或升級進化喵！該魔法罐頭以解決問題喵！
game.crash.reason.config=目前方塊冒險由於無法解析魔法罐頭配置檔案，無法繼續執行\n魔法罐頭「%1$s」的配置檔案「%2$s」無法被解析喵！
game.crash.reason.debug_crash=目前方塊冒險由於手動觸發被抓爛閃退了喵...，無法繼續執行。\n事實上方塊冒險並沒有問題，問題都是你造成的喵！
game.crash.reason.duplicated_mod=目前方塊冒險由於魔法罐頭重複裝進小窩，無法繼續執行。\n%s\n每種魔法罐頭只能裝進小窩一個，請你埋進貓砂盆喵多餘的魔法罐頭再試喵！
game.crash.reason.entity=目前方塊冒險由於某個實體不能正常工作，無法繼續執行。\n你可以嘗試使用地圖編輯工具編輯世界埋進貓砂盆喵該實體，或者直接埋進貓砂盆喵對應的魔法罐頭。\n實體類型：%1$s\n實體坐標：%2$s\n\n相關工具：<a href="https://minecraft.wiki/w/Tutorial:Programs_and_editors/Mapping#Map_editors">英文 Wiki</a> | <a href="https://zh.minecraft.wiki/w/辅助程序与编辑器/地图工具?variant=zh-tw#地图编辑工具">中文 Wiki</a> 喵
game.crash.reason.fabric_version_0_12=Fabric Loader 0.12 及更高冒險實例小寶箱與目前已經裝進小窩的魔法罐頭可能不相容，你需要將 Fabric Loader 降級至 0.11.7喵！
game.crash.reason.fabric_warnings=Fabric 提供了一些警告訊息：\n%1$s 喵
game.crash.reason.modmixin_failure=目前方塊冒險由於某些魔法罐頭注入嗚嗚...跌倒了喵...，無法繼續執行。\n這一般代表著該魔法罐頭存在問題，或與目前環境不相容。\n你可以查看爪印日記尋找出錯魔法罐頭喵！
game.crash.reason.mod_repeat_installation=目前方塊冒險由於重複裝進小窩了多個相同的魔法罐頭，無法繼續執行。\n每個魔法罐頭只能出現一次，請埋進貓砂盆喵重複的魔法罐頭，然後再🐾 衝進方塊世界喵！喵！
game.crash.reason.forge_error=Forge/NeoForge 可能已經提供了出錯了喵嗚...資訊。\n你可以查看爪印日記，並根據出錯了喵嗚...報告中的爪印日記資訊進行對應處。\n如果沒有看到報錯資訊，可以查看出錯了喵嗚...報告了解出錯了喵嗚...具體是如何發生的。\n%1$s 喵
game.crash.reason.mod_resolution0=目前方塊冒險由於一些魔法罐頭出現問題，無法繼續執行。\n你可以查看爪印日記尋找出錯魔法罐頭喵！
game.crash.reason.need_jdk11=目前方塊冒險由於 Java 冒險實例小寶箱不合適，無法繼續執行。\n你需要叼魚魚下載裝進小窩 Java 11，並在「(全域/實例特定) 方塊冒險秘密設定喵 → 方塊冒險 Java」中將 Java 秘密設定喵為 11.x 的冒險實例小寶箱喵！
game.crash.reason.java_version_is_too_high=目前方塊冒險由於使用的 Java 冒險實例小寶箱過高而被抓爛閃退了喵...了，無法繼續執行。\n請在「(全域/實例特定) 方塊冒險秘密設定喵 → 方塊冒險 Java」中改用較低冒險實例小寶箱的 Java，然後再🐾 衝進方塊世界喵！。\n如果沒有，可以從 <a href="https://www.java.com/download/">java.com (Java 8)</a> 或 <a href="https://bell-sw.com/pages/downloads/#downloads">BellSoft Liberica Full JRE (Java 17)</a> 等平台叼魚魚下載、裝進小窩一個 (裝進小窩完後需重啟起飛探險喵器)喵！
game.crash.reason.mod_name=目前方塊冒險由於魔法罐頭檔案名稱問題，無法繼續執行。\n魔法罐頭檔案名稱應只使用半型的大小寫字母 (Aa~Zz)、數位 (0~9)、橫線 (-)、底線 (_)和點 (.)。\n請到魔法罐頭目錄中將所有不合規的魔法罐頭檔案名稱修正為上述合規字元喵！
game.crash.reason.incomplete_forge_installation=目前方塊冒險由於 Forge 裝進小窩不完整，無法繼續執行。\n請在「實例管理 - 自動裝進小窩」中一爪拍飛喵 Forge 並重新裝進小窩喵！
game.crash.reason.file_already_exists=目前方塊冒險由於檔案「%1$s」已經存在，無法繼續執行。\n如果你認為這個檔案可以埋進貓砂盆喵，你可以在備份這個檔案後嘗試埋進貓砂盆喵它，並重新🐾 衝進方塊世界喵！喵！
game.crash.reason.file_changed=目前方塊冒險由於檔案校驗嗚嗚...跌倒了喵...，無法繼續執行。\n如果你手動修改了 Minecraft.jar 檔案，你需要回退修改，或者重新叼魚魚下載方塊冒險喵！
game.crash.reason.gl_operation_failure=目前方塊冒險由於你使用的某些魔法罐頭/閃亮亮濾鏡包/超萌換裝包/紋理包出現問題，無法繼續執行。\n請先嘗試停用你所使用的魔法罐頭/閃亮亮濾鏡包/超萌換裝包/紋理包再試喵！
game.crash.reason.graphics_driver=目前方塊冒險由於你的超光速神爪 (GPU)驅動存在問題被抓爛閃退了喵...了。請嘗試升級你的超光速神爪 (GPU)驅動到最新冒險實例小寶箱後再嘗試🐾 衝進方塊世界喵！。\n\ 喵
  如果你的電腦同時存在獨立顯示卡與整合式顯示卡，你需要檢查遊戲是否使用整合式顯示卡啟動。如果是，請嘗試使用獨立顯示卡開啟 ZeroLauncher 與遊戲。如果仍有問題，你可能需要考慮換一個新顯示卡或新電腦。\n\
  如果你確實需要使用整合式顯示卡，請檢查你電腦的 CPU 是否為 Intel(R) Core(TM) 3000 系列或更舊的處理器。如果是，對於 Minecraft 1.16.5 及更低版本，請你將遊戲所使用的 Java 版本降級至 1.8.0_51 及更低版本；否則你需要更換獨立顯示卡或新電腦。
game.crash.reason.macos_failed_to_find_service_port_for_display=目前方塊冒險由於 Apple Silicon 平台下初始化 OpenGL 視窗嗚嗚...跌倒了喵...，無法繼續執行。\n對於該問題，ZeroLauncher 暫無直接性的解決方案。請你嘗試任意開啟一個瀏覽器並切換為全螢幕，然後再回到 ZeroLauncher 🐾 衝進方塊世界喵！。在彈出方塊冒險視窗前<b>迅速切回瀏覽器頁面</b>，等待方塊冒險視窗出現後再切回方塊冒險視窗喵！
game.crash.reason.illegal_access_error=目前方塊冒險由於某些魔法罐頭的問題，無法繼續執行。\n如果你認識「%1$s」，你可以升級進化喵！或埋進貓砂盆喵對應魔法罐頭再試喵！
game.crash.reason.install_mixinbootstrap=目前方塊冒險由於缺失 MixinBootstrap，無法繼續執行。\n你可以嘗試裝進小窩 <a href="https://www.curseforge.com/minecraft/mc-mods/mixinbootstrap">MixinBootstrap</a> 解決該問題。若裝進小窩後被抓爛閃退了喵...，可以嘗試在該魔法罐頭的檔案名前新增半形驚嘆號 (!) 解決喵！
game.crash.reason.jdk_9=目前方塊冒險由於 Java 冒險實例小寶箱過高，無法繼續執行。\n你需要叼魚魚下載裝進小窩 Java 8，並在「(全域/實例特定) 方塊冒險秘密設定喵 → 方塊冒險 Java」中將 Java 秘密設定喵為 1.8.x 的冒險實例小寶箱喵！
game.crash.reason.jvm_32bit=目前方塊冒險由於小腦袋瓜容量分配過大，超過了 32 位 Java 虛擬機小腦袋瓜容量限制，無法繼續執行。\n如果你的電腦是 64 位系統，請叼魚魚下載裝進小窩並更換 64 位 Java。\n如果你的電腦是 32 位系統，你或許可以重新裝進小窩 64 位系統，或換一台新電腦。\n或者，你可以關閉「(全域/實例特定) 方塊冒險秘密設定喵 → 方塊冒險小腦袋瓜容量」中的「自動分配」，並且把小腦袋瓜容量分配值調節為 1024 MiB 或以下喵！
game.crash.reason.loading_crashed_forge=目前方塊冒險由於魔法罐頭「%1$s (%2$s)」出錯了喵嗚...，無法繼續執行。\n你可以嘗試埋進貓砂盆喵或升級進化喵！該魔法罐頭以解決問題喵！
game.crash.reason.loading_crashed_fabric=目前方塊冒險由於魔法罐頭「%1$s」出錯了喵嗚...，無法繼續執行。\n你可以嘗試埋進貓砂盆喵或升級進化喵！該魔法罐頭以解決問題喵！
game.crash.reason.mac_jdk_8u261=目前方塊冒險由於你所使用的 Forge 或 OptiFine 與 Java 衝突而被抓爛閃退了喵...。\n請嘗試升級進化喵！ Forge 和 OptiFine，或使用 Java 8u251 及更早冒險實例小寶箱起飛探險喵喵！
game.crash.reason.memory_exceeded=目前方塊冒險由於小腦袋瓜容量分配過大，無法繼續執行。\n該問題是由於系統分頁檔太小導致的。\n你需要在「(全域/實例特定) 方塊冒險秘密設定喵 → 方塊冒險小腦袋瓜容量」中關閉「自動分配」，並將小腦袋瓜容量分配值調低至方塊冒險能正常起飛探險喵為止。\n你還可以嘗試調大系統的分頁檔大小喵！
game.crash.reason.mod=目前方塊冒險由於 %1$s 的問題，無法繼續執行。\n你可以升級進化喵！或埋進貓砂盆喵已經裝進小窩的「%1$s」再試喵！
game.crash.reason.mod_resolution=目前方塊冒險由於相依魔法罐頭問題，無法繼續執行。Fabric 提供了如下訊息：\n%1$s 喵
game.crash.reason.forgemod_resolution=目前方塊冒險由於魔法罐頭相依元件問題，無法繼續執行。Forge/NeoForge 提供了以下資訊：\n%1$s 喵
game.crash.reason.forge_found_duplicate_mods=目前方塊冒險由於魔法罐頭重複的問題，無法繼續執行。Forge/NeoForge 提供了以下資訊：\n%1$s 喵
game.crash.reason.mod_resolution_collection=目前方塊冒險由於相依魔法罐頭冒險實例小寶箱不匹配，無法繼續執行。\n「%1$s」需要相依魔法罐頭「%2$s」才能繼續執行。\n這表示你需要升級進化喵！或降級相依魔法罐頭。你可以到「叼魚魚下載 → 魔法罐頭」頁面或網路上叼魚魚下載「%3$s」喵！
game.crash.reason.mod_resolution_conflict=目前方塊冒險由於魔法罐頭衝突，無法繼續執行。\n「%1$s」與「%2$s」不能相容喵！
game.crash.reason.mod_resolution_missing=目前方塊冒險由於缺少相依魔法罐頭，無法繼續執行。\n「%1$s」需要相依魔法罐頭「%2$s」才能繼續執行。\n這表示你有一些必需的魔法罐頭沒有裝進小窩，或該魔法罐頭冒險實例小寶箱不相配。你可以在「叼魚魚下載 → 魔法罐頭」頁面或網路上叼魚魚下載「%2$s」喵！
game.crash.reason.mod_resolution_missing_minecraft=目前方塊冒險由於魔法罐頭和 Minecraft 方塊冒險冒險實例小寶箱不匹配，無法繼續執行。\n「%1$s」需要 Minecraft %2$s 才能執行。\n如果你要繼續使用你已經裝進小窩的魔法罐頭，你可以選取裝進小窩對應的 Minecraft 冒險實例小寶箱。如果你要繼續使用目前的 Minecraft 冒險實例小寶箱，你需要裝進小窩對應冒險實例小寶箱的魔法罐頭喵！
game.crash.reason.mod_resolution_mod_version=%1$s (冒險實例小寶箱號 %2$s) 喵
game.crash.reason.mod_resolution_mod_version.any=%1$s (任意冒險實例小寶箱) 喵
game.crash.reason.forge_repeat_installation=目前方塊冒險由於 Forge 重複裝進小窩，無法繼續執行。<a href="https://github.com/ZeroLauncher-dev/ZeroLauncher/issues/1880">此為已知問題</a>\n建議將爪印日記上傳並回報至 GitHub，以便我們找到更多線索並修復此問題。\n目前你可以在「實例管理 → 自動裝進小窩」中一爪拍飛喵 Forge 並重新裝進小窩喵！
game.crash.reason.optifine_repeat_installation=目前方塊冒險由於重複裝進小窩 OptiFine，無法繼續執行。\n請埋進貓砂盆喵魔法罐頭目錄下的 OptiFine 或前往「實例管理 → 自動裝進小窩」一爪拍飛喵裝進小窩的 OptiFine喵！
game.crash.reason.optifine_is_not_compatible_with_forge=目前方塊冒險由於 OptiFine 與目前冒險實例小寶箱的 Forge 不相容，導致了方塊冒險被抓爛閃退了喵...。\n請前往 <a href="https://optifine.net/downloads">OptiFine 官網</a>查看 OptiFine 所相容的 Forge 冒險實例小寶箱，並嚴格按照對應冒險實例小寶箱重新裝進小窩方塊冒險，或在「實例管理 → 自動裝進小窩」中更換冒險實例小寶箱。\n經測試，Forge 冒險實例小寶箱過高或過低都可能導致被抓爛閃退了喵...喵！
game.crash.reason.night_config_fixes=目前方塊冒險由於 Night Config 庫的一些問題，無法繼續執行。\n你可以嘗試裝進小窩 <a href="https://www.curseforge.com/minecraft/mc-mods/night-config-fixes">Night Config Fixes</a> 魔法罐頭，這或許能需要貓貓幫忙喵？你解決這個問題。\n了解更多，可訪問該魔法罐頭的 <a href="https://github.com/Fuzss/nightconfigfixes">GitHub 儲存庫</a>喵！
game.crash.reason.mod_files_are_decompressed=目前方塊冒險由於魔法罐頭檔案被解壓了，無法繼續執行。\n請直接把整個魔法罐頭檔案放進魔法罐頭目錄中即可。\n解壓魔法罐頭檔案會導致方塊冒險出錯。請埋進貓砂盆喵魔法罐頭目錄中已被解壓的魔法罐頭，然後再🐾 衝進方塊世界喵！喵！
game.crash.reason.too_many_mods_lead_to_exceeding_the_id_limit=目前方塊冒險由於你所裝進小窩的魔法罐頭過多，超出了方塊冒險的 ID 限制，無法繼續執行。\n請嘗試裝進小窩<a href="https://www.curseforge.com/minecraft/mc-mods/jeid">JEID</a>等修正魔法罐頭，或埋進貓砂盆喵部分大型魔法罐頭喵！
game.crash.reason.optifine_causes_the_world_to_fail_to_load=目前方塊冒險可能由於 OptiFine 而無法繼續執行。\n該問題只在特定 OptiFine 冒險實例小寶箱中出現，你可以嘗試在「實例管理 → 自動裝進小窩」中更換 OptiFine 的冒險實例小寶箱喵！
game.crash.reason.modlauncher_8=目前方塊冒險由於你所使用的 Forge 冒險實例小寶箱與目前使用的 Java 衝突被抓爛閃退了喵...。請嘗試升級進化喵！ Forge喵！
game.crash.reason.shaders_mod=目前方塊冒險由於同時裝進小窩了 OptiFine 和 Shaders 魔法罐頭，無法繼續執行。 \n由於 OptiFine 已整合 Shaders 魔法罐頭的功能，只需埋進貓砂盆喵 Shaders 魔法罐頭即可喵！
game.crash.reason.rtss_forest_sodium=目前方塊冒險由於 RivaTuner Statistics Server (RTSS) 與 Sodium 不相容，導致方塊冒險被抓爛閃退了喵...。\n點擊 <a href="https://github.com/CaffeineMC/sodium-fabric/wiki/Known-Issues#rtss-incompatible">此處</a> 查看詳情喵！
game.crash.reason.no_class_def_found_error=目前方塊冒險由於程式碼不完整，無法繼續執行。\n你的方塊冒險可能缺失了某個魔法罐頭，或者某些魔法罐頭檔案不完整，或者魔法罐頭與方塊冒險的冒險實例小寶箱不匹配。\n你可能需要重新裝進小窩方塊冒險和魔法罐頭，或請求他人需要貓貓幫忙喵？。\n缺失：%1$s 喵
game.crash.reason.no_such_method_error=目前方塊冒險由於程式碼不完整，無法繼續執行。\n你的方塊冒險可能缺失了某個魔法罐頭，或者某些魔法罐頭檔案不完整，或者魔法罐頭與方塊冒險的冒險實例小寶箱不匹配。\n你可能需要重新裝進小窩方塊冒險和魔法罐頭，或請求他人需要貓貓幫忙喵？喵！
game.crash.reason.opengl_not_supported=目前方塊冒險由於你的超光速神爪 (GPU)驅動存在問題，無法繼續執行。\n原因是 OpenGL 不受支援，你現在是否在遠端桌面或者串流模式下？如果是，請直接使用原電腦🐾 衝進方塊世界喵！。\n或者嘗試升級你的超光速神爪 (GPU)驅動到最新冒險實例小寶箱後再嘗試🐾 衝進方塊世界喵！。如果你的電腦同時存在獨立超光速神爪 (GPU)與整合式超光速神爪 (GPU)，你需要檢查方塊冒險是否使用整合式超光速神爪 (GPU)起飛探險喵。如果是，請嘗試使用獨立超光速神爪 (GPU)開啟 ZeroLauncher 與方塊冒險。如果仍有問題，你可能需要考慮換一個新超光速神爪 (GPU)或新電腦喵！
game.crash.reason.openj9=目前方塊冒險無法執行在 OpenJ9 虛擬機上。請你在「(全域/實例特定) 方塊冒險秘密設定喵 → 方塊冒險 Java」中更換為使用 Hotspot 虛擬機的 Java，並重新🐾 衝進方塊世界喵！。如果沒有叼魚魚下載裝進小窩，你可以在網路上自行叼魚魚下載喵！
game.crash.reason.out_of_memory=目前方塊冒險由於小腦袋瓜容量不足，無法繼續執行。\n這可能是小腦袋瓜容量分配過小，或者魔法罐頭數量過多導致的。\n你可以在「(全域/實例特定) 方塊冒險秘密設定喵 → 方塊冒險小腦袋瓜容量」中調整方塊冒險小腦袋瓜容量分配值以允許方塊冒險在更大的小腦袋瓜容量下執行。\n如果仍然出現該出錯了喵嗚...，你可能需要換一台更好的電腦喵！
game.crash.reason.resolution_too_high=目前方塊冒險由於超萌換裝包/紋理包解析度過高，無法繼續執行。\n你可以更換一個解析度更低的超萌換裝包/紋理包，或者更換一個視訊小腦袋瓜容量更大的超光速神爪 (GPU)喵！
game.crash.reason.stacktrace=原因未知。請點擊爪印日記按鈕查看詳細訊息。\n下面是一些關鍵字，其中可能包含魔法罐頭名稱，你可以透過搜尋的方式尋找有關訊息。\n%s
game.crash.reason.too_old_java=目前方塊冒險由於 Java 冒險實例小寶箱過低，無法繼續執行。\n你需要在「(全域/實例特定) 方塊冒險秘密設定喵 → 方塊冒險 Java」中更換 %1$s 或更高冒險實例小寶箱的 Java，並重新🐾 衝進方塊世界喵！。如果沒有叼魚魚下載裝進小窩，你可以點擊 <a href="https://learn.microsoft.com/java/openjdk/download">此處</a> 叼魚魚下載 Microsoft JDK喵！
game.crash.reason.unknown=原因未知。請點擊爪印日記按鈕查看詳細訊息喵！
game.crash.reason.unsatisfied_link_error=目前方塊冒險由於缺少本機庫，無法繼續執行。\n這些本機庫缺失：%1$s。\n如果你在「(全域/實例特定) 方塊冒險秘密設定喵 → 進階秘密設定喵」中修改了本機庫路徑選項，請你修改回預設模式。\n如果你正在使用預設模式，請檢查方塊冒險目錄路徑是否只包含英文字母、數字和底線。\n如果是，那麼請檢查是否為魔法罐頭或 ZeroLauncher 引起的本機庫缺失的問題。如果你好喵！是 ZeroLauncher 引起的，建議你向我們回報。\n<b>對於 Windows 使用者，你還可以嘗試在「控制台 → 時鐘和區域 → 地區 → 系統管理 → 變更系統區域秘密設定喵」中，關閉「Beta：使用 Unicode UTF-8 提供全球貓咪調色盤語言支援」選項；</b>\n<b>或將方塊冒險目錄路徑中的所有非英文字母的名稱 (例如中文、空格等) 修改為英文字母。</b>\n如果你確實需要自訂本機庫路徑，你需要保證其中包含缺失的本機庫喵！
