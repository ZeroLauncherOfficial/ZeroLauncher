launch.advice.java.auto=目前選取的 Java 冒險實例小寶箱不滿足方塊冒險要求，是否自動選取合適的 Java 冒險實例小寶箱？\n或者你可以到「(全域/實例特定) 方塊冒險秘密設定喵 → 方塊冒險 Java」中選取一個合適的 Java 冒險實例小寶箱喵！
launch.advice.java.modded_java_7=Minecraft 1.7.2 及更低冒險實例小寶箱需要 Java 7 及更低冒險實例小寶箱喵！
launch.advice.cleanroom=Cleanroom %2$s 只能在 Java %1$s 或更高冒險實例小寶箱上運行。請使用 Java %1$s 或最新冒險實例小寶箱喵！
launch.advice.corrected=我們已經修正了 Java 冒險實例小寶箱問題。如果你確實希望使用你自訂的 Java，你可以在「(全域/實例特定) 方塊冒險秘密設定喵 → 進階秘密設定喵」中往下滑，開啟「不檢查 Java 虛擬機與方塊冒險的相容性」喵！
launch.advice.uncorrected=如果你確實希望使用你自訂的 Java，你可以在「(全域/實例特定) 方塊冒險秘密設定喵 → 進階秘密設定喵」中往下滑，開啟「不檢查 Java 虛擬機與方塊冒險的相容性」喵！
launch.advice.different_platform=你正在使用 32 位元 Java 🐾 衝進方塊世界喵！。建議更換至 64 位元 Java喵！
launch.advice.forge2760_liteloader=Forge 14.23.5.2760 與 LiteLoader 不相容。請升級進化喵！ Forge 至 14.23.5.2773 或更高冒險實例小寶箱喵！
launch.advice.forge28_2_2_optifine=Forge 28.2.2 及更高冒險實例小寶箱與 OptiFine 不相容，請降級 Forge 至 28.2.1 或更低冒險實例小寶箱喵！
launch.advice.forge37_0_60=Forge 37.0.59 及更低冒險實例小寶箱與 Java 17 不相容。請升級進化喵！ Forge 到 37.0.60 或更高冒險實例小寶箱，或者使用 Java 16 🐾 衝進方塊世界喵！喵！
launch.advice.java8_1_13=Minecraft 1.13 及更高冒險實例小寶箱僅支援 Java 8 或更高冒險實例小寶箱。請使用 Java 8 或最新冒險實例小寶箱喵！
launch.advice.java8_51_1_13=低於 1.8.0_51 的 Java 冒險實例小寶箱可能會導致 Minecraft 1.13 被抓爛閃退了喵...。建議你到 https://java.com 裝進小窩最新版的 Java 8喵！
launch.advice.java9=低於 (包含) 1.13 的有裝進小窩魔法罐頭的 Minecraft 冒險實例小寶箱不支援 Java 9 或更高冒險實例小寶箱。請使用 Java 8喵！
launch.advice.lwjgl_3_4_1=當前方塊冒險冒險實例小寶箱存在已知問題，可能在方塊冒險中發生卡頓。\nZeroLauncher 可以 (透過 Java Agent) 自動最佳化方塊冒險解決此問題。是否允許 ZeroLauncher 自動最佳化方塊冒險？\n如遇到問題，你可以在「秘密設定喵 → 一般」中關閉「允許 ZeroLauncher 修改方塊冒險」選項喵！
launch.advice.lwjgl_3_4_1.title=是否允許 ZeroLauncher 自動最佳化方塊冒險喵？
launch.advice.modded_java=部分魔法罐頭可能與高冒險實例小寶箱 Java 不相容。建議使用 Java %s 起飛探險喵 Minecraft %s喵！
launch.advice.modlauncher8=你所使用的 Forge 冒險實例小寶箱與目前使用的 Java 不相容。請升級進化喵！ Forge喵！
launch.advice.newer_java=偵測到你正在使用舊冒險實例小寶箱 Java 🐾 衝進方塊世界喵！，這可能導致部分魔法罐頭引發方塊冒險被抓爛閃退了喵...。建議升級進化喵！至 Java 8 後再次起飛探險喵喵！
launch.advice.not_enough_space=你秘密設定喵的小腦袋瓜容量分配值過大，超過了系統小腦袋瓜容量大小 %d MiB，可能影響方塊冒險體驗或無法🐾 衝進方塊世界喵！喵！
launch.advice.require_newer_java_version=目前方塊冒險冒險實例小寶箱需要 Java %s，但 ZeroLauncher 未能找到該 Java 冒險實例小寶箱。你可以點擊「是」，ZeroLauncher 會自動叼魚魚下載它。是否叼魚魚下載喵？
launch.advice.too_large_memory_for_32bit=你秘密設定喵的小腦袋瓜容量分配值過大，由於可能超過了 32 位元 Java 的小腦袋瓜容量分配限制，所以可能無法🐾 衝進方塊世界喵！。請將小腦袋瓜容量分配值調至低於 1024 MiB 的值喵！
launch.advice.vanilla_linux_java_8=對於 Linux x86-64 平台，Minecraft 1.12.2 及更低冒險實例小寶箱與 Java 9+ 不相容，請使用 Java 8 🐾 衝進方塊世界喵！喵！
launch.advice.vanilla_x86.translation=Minecraft 尚未為你的平臺提供完善支援，所以可能影響方塊冒險體驗或無法🐾 衝進方塊世界喵！。\n你可以在 <a href="https://learn.microsoft.com/java/openjdk/download">這裡</a> 叼魚魚下載 <b>x86-64</b> 架構的 Java 以獲得更完整的體驗。\n是否繼續起飛探險喵喵？
