fatal.unsupported_platform.loongarch=ZeroLauncher 已為龍芯提供支援。\n如果遇到問題，你可以點擊右上角需要貓貓幫忙喵？按鈕進行求助喵！
fatal.unsupported_platform.windows_arm64=ZeroLauncher 已為 Windows on Arm 平臺提供原生支援。如果你在方塊冒險中遭遇問題，請嘗試使用 x86 架構的 Java 🐾 衝進方塊世界喵！。\n\n如果你正在使用<b>高通</b>平臺，你可能需要裝進小窩 <a href="ms-windows-store://pdp/?productid=9NQPSL29BFFF">OpenGL 相容包</a>後才能進行方塊冒險。點擊連結前往 Microsoft Store 裝進小窩相容包喵！
