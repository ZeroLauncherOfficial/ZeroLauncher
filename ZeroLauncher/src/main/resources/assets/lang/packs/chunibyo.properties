game.crash.feedback=<b>請不要將本介面截圖或拍照給他人！</b>如果你要求助他人，請你點擊左下角「匯出深淵異界結界崩塌破碎...資訊」後將匯出的檔案發送給他人以供分析。\n你可以點擊下方的「幫助」前往社群尋求幫助。
