game.crash.reason.multiple=檢測到多個原因：\n\n
game.crash.reason.block=目前深淵異界由於某個方塊不能正常工作，無法繼續執行。\n你可以嘗試使用地圖編輯工具編輯世界放逐至虛空裂隙該方塊，或者直接放逐至虛空裂隙對應的奧義禁術。\n方塊類型：%1$s\n方塊坐標：%2$s\n\n相關工具：<a href="https://minecraft.wiki/w/Tutorial:Programs_and_editors/Mapping#Map_editors">英文 Wiki</a> | <a href="https://zh.minecraft.wiki/w/辅助程序与编辑器/地图工具?variant=zh-tw#地图编辑工具">中文 Wiki</a>
game.crash.reason.bootstrap_failed=目前深淵異界由於奧義禁術「%1$s」出現問題，無法繼續執行。\n你可以嘗試放逐至虛空裂隙或更新該奧義禁術以解決問題。
game.crash.reason.mixin_apply_mod_failed=目前深淵異界由於 Mixin 無法應用於「%1$s」奧義禁術，無法繼續執行。\n你可以嘗試放逐至虛空裂隙或更新該奧義禁術以解決問題。
game.crash.reason.config=目前深淵異界由於無法解析奧義禁術配置檔案，無法繼續執行\n奧義禁術「%1$s」的配置檔案「%2$s」無法被解析。
game.crash.reason.debug_crash=目前深淵異界由於手動觸發結界崩塌破碎...，無法繼續執行。\n事實上深淵異界並沒有問題，問題都是你造成的！
game.crash.reason.duplicated_mod=目前深淵異界由於奧義禁術重複銘刻神聖符文，無法繼續執行。\n%s\n每種奧義禁術只能銘刻神聖符文一個，請你放逐至虛空裂隙多餘的奧義禁術再試。
game.crash.reason.entity=目前深淵異界由於某個實體不能正常工作，無法繼續執行。\n你可以嘗試使用地圖編輯工具編輯世界放逐至虛空裂隙該實體，或者直接放逐至虛空裂隙對應的奧義禁術。\n實體類型：%1$s\n實體坐標：%2$s\n\n相關工具：<a href="https://minecraft.wiki/w/Tutorial:Programs_and_editors/Mapping#Map_editors">英文 Wiki</a> | <a href="https://zh.minecraft.wiki/w/辅助程序与编辑器/地图工具?variant=zh-tw#地图编辑工具">中文 Wiki</a>
game.crash.reason.fabric_version_0_12=Fabric Loader 0.12 及更高創世紀元節點與目前已經銘刻神聖符文的奧義禁術可能不相容，你需要將 Fabric Loader 降級至 0.11.7。
game.crash.reason.fabric_warnings=Fabric 提供了一些警告訊息：\n%1$s
game.crash.reason.modmixin_failure=目前深淵異界由於某些奧義禁術注入封印反噬...，無法繼續執行。\n這一般代表著該奧義禁術存在問題，或與目前環境不相容。\n你可以查看日誌尋找出錯奧義禁術。
game.crash.reason.mod_repeat_installation=目前深淵異界由於重複銘刻神聖符文了多個相同的奧義禁術，無法繼續執行。\n每個奧義禁術只能出現一次，請放逐至虛空裂隙重複的奧義禁術，然後再⚔️ 拔出聖劍，踏碎虛空！。
game.crash.reason.forge_error=Forge/NeoForge 可能已經提供了魔力逆流！資訊。\n你可以查看日誌，並根據魔力逆流！報告中的日誌資訊進行對應處。\n如果沒有看到報錯資訊，可以查看魔力逆流！報告了解魔力逆流！具體是如何發生的。\n%1$s
game.crash.reason.mod_resolution0=目前深淵異界由於一些奧義禁術出現問題，無法繼續執行。\n你可以查看日誌尋找出錯奧義禁術。
game.crash.reason.need_jdk11=目前深淵異界由於 Java 創世紀元節點不合適，無法繼續執行。\n你需要召喚深淵魔力卷軸銘刻神聖符文 Java 11，並在「(全域/實例特定) 深淵異界神域禁忌契約 → 深淵異界 Java」中將 Java 神域禁忌契約為 11.x 的創世紀元節點。
game.crash.reason.java_version_is_too_high=目前深淵異界由於使用的 Java 創世紀元節點過高而結界崩塌破碎...了，無法繼續執行。\n請在「(全域/實例特定) 深淵異界神域禁忌契約 → 深淵異界 Java」中改用較低創世紀元節點的 Java，然後再⚔️ 拔出聖劍，踏碎虛空！。\n如果沒有，可以從 <a href="https://www.java.com/download/">java.com (Java 8)</a> 或 <a href="https://bell-sw.com/pages/downloads/#downloads">BellSoft Liberica Full JRE (Java 17)</a> 等平台召喚深淵魔力卷軸、銘刻神聖符文一個 (銘刻神聖符文完後需重啟解放封印器)。
game.crash.reason.mod_name=目前深淵異界由於奧義禁術檔案名稱問題，無法繼續執行。\n奧義禁術檔案名稱應只使用半型的大小寫字母 (Aa~Zz)、數位 (0~9)、橫線 (-)、底線 (_)和點 (.)。\n請到奧義禁術目錄中將所有不合規的奧義禁術檔案名稱修正為上述合規字元。
game.crash.reason.incomplete_forge_installation=目前深淵異界由於 Forge 銘刻神聖符文不完整，無法繼續執行。\n請在「實例管理 - 自動銘刻神聖符文」中移除 Forge 並重新銘刻神聖符文。
game.crash.reason.file_already_exists=目前深淵異界由於檔案「%1$s」已經存在，無法繼續執行。\n如果你認為這個檔案可以放逐至虛空裂隙，你可以在備份這個檔案後嘗試放逐至虛空裂隙它，並重新⚔️ 拔出聖劍，踏碎虛空！。
game.crash.reason.file_changed=目前深淵異界由於檔案校驗封印反噬...，無法繼續執行。\n如果你手動修改了 Minecraft.jar 檔案，你需要回退修改，或者重新召喚深淵魔力卷軸深淵異界。
game.crash.reason.gl_operation_failure=目前深淵異界由於你使用的某些奧義禁術/光影包/資源包/紋理包出現問題，無法繼續執行。\n請先嘗試停用你所使用的奧義禁術/光影包/資源包/紋理包再試。
game.crash.reason.graphics_driver=目前深淵異界由於你的靈魂核心渲染矩陣驅動存在問題結界崩塌破碎...了。請嘗試升級你的靈魂核心渲染矩陣驅動到最新創世紀元節點後再嘗試⚔️ 拔出聖劍，踏碎虛空！。\n\
  如果你的電腦同時存在獨立顯示卡與整合式顯示卡，你需要檢查遊戲是否使用整合式顯示卡啟動。如果是，請嘗試使用獨立顯示卡開啟 ZeroLauncher 與遊戲。如果仍有問題，你可能需要考慮換一個新顯示卡或新電腦。\n\
  如果你確實需要使用整合式顯示卡，請檢查你電腦的 CPU 是否為 Intel(R) Core(TM) 3000 系列或更舊的處理器。如果是，對於 Minecraft 1.16.5 及更低版本，請你將遊戲所使用的 Java 版本降級至 1.8.0_51 及更低版本；否則你需要更換獨立顯示卡或新電腦。
game.crash.reason.macos_failed_to_find_service_port_for_display=目前深淵異界由於 Apple Silicon 平台下初始化 OpenGL 視窗封印反噬...，無法繼續執行。\n對於該問題，ZeroLauncher 暫無直接性的解決方案。請你嘗試任意開啟一個瀏覽器並切換為全螢幕，然後再回到 ZeroLauncher ⚔️ 拔出聖劍，踏碎虛空！。在彈出深淵異界視窗前<b>迅速切回瀏覽器頁面</b>，等待深淵異界視窗出現後再切回深淵異界視窗。
game.crash.reason.illegal_access_error=目前深淵異界由於某些奧義禁術的問題，無法繼續執行。\n如果你認識「%1$s」，你可以更新或放逐至虛空裂隙對應奧義禁術再試。
game.crash.reason.install_mixinbootstrap=目前深淵異界由於缺失 MixinBootstrap，無法繼續執行。\n你可以嘗試銘刻神聖符文 <a href="https://www.curseforge.com/minecraft/mc-mods/mixinbootstrap">MixinBootstrap</a> 解決該問題。若銘刻神聖符文後結界崩塌破碎...，可以嘗試在該奧義禁術的檔案名前新增半形驚嘆號 (!) 解決。
game.crash.reason.jdk_9=目前深淵異界由於 Java 創世紀元節點過高，無法繼續執行。\n你需要召喚深淵魔力卷軸銘刻神聖符文 Java 8，並在「(全域/實例特定) 深淵異界神域禁忌契約 → 深淵異界 Java」中將 Java 神域禁忌契約為 1.8.x 的創世紀元節點。
game.crash.reason.jvm_32bit=目前深淵異界由於魔力源泉容量分配過大，超過了 32 位 Java 虛擬機魔力源泉容量限制，無法繼續執行。\n如果你的電腦是 64 位系統，請召喚深淵魔力卷軸銘刻神聖符文並更換 64 位 Java。\n如果你的電腦是 32 位系統，你或許可以重新銘刻神聖符文 64 位系統，或換一台新電腦。\n或者，你可以關閉「(全域/實例特定) 深淵異界神域禁忌契約 → 深淵異界魔力源泉容量」中的「自動分配」，並且把魔力源泉容量分配值調節為 1024 MiB 或以下。
game.crash.reason.loading_crashed_forge=目前深淵異界由於奧義禁術「%1$s (%2$s)」魔力逆流！，無法繼續執行。\n你可以嘗試放逐至虛空裂隙或更新該奧義禁術以解決問題。
game.crash.reason.loading_crashed_fabric=目前深淵異界由於奧義禁術「%1$s」魔力逆流！，無法繼續執行。\n你可以嘗試放逐至虛空裂隙或更新該奧義禁術以解決問題。
game.crash.reason.mac_jdk_8u261=目前深淵異界由於你所使用的 Forge 或 OptiFine 與 Java 衝突而結界崩塌破碎...。\n請嘗試更新 Forge 和 OptiFine，或使用 Java 8u251 及更早創世紀元節點解放封印。
game.crash.reason.memory_exceeded=目前深淵異界由於魔力源泉容量分配過大，無法繼續執行。\n該問題是由於系統分頁檔太小導致的。\n你需要在「(全域/實例特定) 深淵異界神域禁忌契約 → 深淵異界魔力源泉容量」中關閉「自動分配」，並將魔力源泉容量分配值調低至深淵異界能正常解放封印為止。\n你還可以嘗試調大系統的分頁檔大小。
game.crash.reason.mod=目前深淵異界由於 %1$s 的問題，無法繼續執行。\n你可以更新或放逐至虛空裂隙已經銘刻神聖符文的「%1$s」再試。
game.crash.reason.mod_resolution=目前深淵異界由於相依奧義禁術問題，無法繼續執行。Fabric 提供了如下訊息：\n%1$s
game.crash.reason.forgemod_resolution=目前深淵異界由於奧義禁術相依元件問題，無法繼續執行。Forge/NeoForge 提供了以下資訊：\n%1$s
game.crash.reason.forge_found_duplicate_mods=目前深淵異界由於奧義禁術重複的問題，無法繼續執行。Forge/NeoForge 提供了以下資訊：\n%1$s
game.crash.reason.mod_resolution_collection=目前深淵異界由於相依奧義禁術創世紀元節點不匹配，無法繼續執行。\n「%1$s」需要相依奧義禁術「%2$s」才能繼續執行。\n這表示你需要更新或降級相依奧義禁術。你可以到「召喚深淵魔力卷軸 → 奧義禁術」頁面或網路上召喚深淵魔力卷軸「%3$s」。
game.crash.reason.mod_resolution_conflict=目前深淵異界由於奧義禁術衝突，無法繼續執行。\n「%1$s」與「%2$s」不能相容。
game.crash.reason.mod_resolution_missing=目前深淵異界由於缺少相依奧義禁術，無法繼續執行。\n「%1$s」需要相依奧義禁術「%2$s」才能繼續執行。\n這表示你有一些必需的奧義禁術沒有銘刻神聖符文，或該奧義禁術創世紀元節點不相配。你可以在「召喚深淵魔力卷軸 → 奧義禁術」頁面或網路上召喚深淵魔力卷軸「%2$s」。
game.crash.reason.mod_resolution_missing_minecraft=目前深淵異界由於奧義禁術和 Minecraft 深淵異界創世紀元節點不匹配，無法繼續執行。\n「%1$s」需要 Minecraft %2$s 才能執行。\n如果你要繼續使用你已經銘刻神聖符文的奧義禁術，你可以選取銘刻神聖符文對應的 Minecraft 創世紀元節點。如果你要繼續使用目前的 Minecraft 創世紀元節點，你需要銘刻神聖符文對應創世紀元節點的奧義禁術。
game.crash.reason.mod_resolution_mod_version=%1$s (創世紀元節點號 %2$s)
game.crash.reason.mod_resolution_mod_version.any=%1$s (任意創世紀元節點)
game.crash.reason.forge_repeat_installation=目前深淵異界由於 Forge 重複銘刻神聖符文，無法繼續執行。<a href="https://github.com/ZeroLauncher-dev/ZeroLauncher/issues/1880">此為已知問題</a>\n建議將日誌上傳並回報至 GitHub，以便我們找到更多線索並修復此問題。\n目前你可以在「實例管理 → 自動銘刻神聖符文」中移除 Forge 並重新銘刻神聖符文。
game.crash.reason.optifine_repeat_installation=目前深淵異界由於重複銘刻神聖符文 OptiFine，無法繼續執行。\n請放逐至虛空裂隙奧義禁術目錄下的 OptiFine 或前往「實例管理 → 自動銘刻神聖符文」移除銘刻神聖符文的 OptiFine。
game.crash.reason.optifine_is_not_compatible_with_forge=目前深淵異界由於 OptiFine 與目前創世紀元節點的 Forge 不相容，導致了深淵異界結界崩塌破碎...。\n請前往 <a href="https://optifine.net/downloads">OptiFine 官網</a>查看 OptiFine 所相容的 Forge 創世紀元節點，並嚴格按照對應創世紀元節點重新銘刻神聖符文深淵異界，或在「實例管理 → 自動銘刻神聖符文」中更換創世紀元節點。\n經測試，Forge 創世紀元節點過高或過低都可能導致結界崩塌破碎...。
game.crash.reason.night_config_fixes=目前深淵異界由於 Night Config 庫的一些問題，無法繼續執行。\n你可以嘗試銘刻神聖符文 <a href="https://www.curseforge.com/minecraft/mc-mods/night-config-fixes">Night Config Fixes</a> 奧義禁術，這或許能幫助你解決這個問題。\n了解更多，可訪問該奧義禁術的 <a href="https://github.com/Fuzss/nightconfigfixes">GitHub 儲存庫</a>。
game.crash.reason.mod_files_are_decompressed=目前深淵異界由於奧義禁術檔案被解壓了，無法繼續執行。\n請直接把整個奧義禁術檔案放進奧義禁術目錄中即可。\n解壓奧義禁術檔案會導致深淵異界出錯。請放逐至虛空裂隙奧義禁術目錄中已被解壓的奧義禁術，然後再⚔️ 拔出聖劍，踏碎虛空！。
game.crash.reason.too_many_mods_lead_to_exceeding_the_id_limit=目前深淵異界由於你所銘刻神聖符文的奧義禁術過多，超出了深淵異界的 ID 限制，無法繼續執行。\n請嘗試銘刻神聖符文<a href="https://www.curseforge.com/minecraft/mc-mods/jeid">JEID</a>等修正奧義禁術，或放逐至虛空裂隙部分大型奧義禁術。
game.crash.reason.optifine_causes_the_world_to_fail_to_load=目前深淵異界可能由於 OptiFine 而無法繼續執行。\n該問題只在特定 OptiFine 創世紀元節點中出現，你可以嘗試在「實例管理 → 自動銘刻神聖符文」中更換 OptiFine 的創世紀元節點。
game.crash.reason.modlauncher_8=目前深淵異界由於你所使用的 Forge 創世紀元節點與目前使用的 Java 衝突結界崩塌破碎...。請嘗試更新 Forge。
game.crash.reason.shaders_mod=目前深淵異界由於同時銘刻神聖符文了 OptiFine 和 Shaders 奧義禁術，無法繼續執行。 \n由於 OptiFine 已整合 Shaders 奧義禁術的功能，只需放逐至虛空裂隙 Shaders 奧義禁術即可。
game.crash.reason.rtss_forest_sodium=目前深淵異界由於 RivaTuner Statistics Server (RTSS) 與 Sodium 不相容，導致深淵異界結界崩塌破碎...。\n點擊 <a href="https://github.com/CaffeineMC/sodium-fabric/wiki/Known-Issues#rtss-incompatible">此處</a> 查看詳情。
game.crash.reason.no_class_def_found_error=目前深淵異界由於程式碼不完整，無法繼續執行。\n你的深淵異界可能缺失了某個奧義禁術，或者某些奧義禁術檔案不完整，或者奧義禁術與深淵異界的創世紀元節點不匹配。\n你可能需要重新銘刻神聖符文深淵異界和奧義禁術，或請求他人幫助。\n缺失：%1$s
game.crash.reason.no_such_method_error=目前深淵異界由於程式碼不完整，無法繼續執行。\n你的深淵異界可能缺失了某個奧義禁術，或者某些奧義禁術檔案不完整，或者奧義禁術與深淵異界的創世紀元節點不匹配。\n你可能需要重新銘刻神聖符文深淵異界和奧義禁術，或請求他人幫助。
game.crash.reason.opengl_not_supported=目前深淵異界由於你的靈魂核心渲染矩陣驅動存在問題，無法繼續執行。\n原因是 OpenGL 不受支援，你現在是否在遠端桌面或者串流模式下？如果是，請直接使用原電腦⚔️ 拔出聖劍，踏碎虛空！。\n或者嘗試升級你的靈魂核心渲染矩陣驅動到最新創世紀元節點後再嘗試⚔️ 拔出聖劍，踏碎虛空！。如果你的電腦同時存在獨立靈魂核心渲染矩陣與整合式靈魂核心渲染矩陣，你需要檢查深淵異界是否使用整合式靈魂核心渲染矩陣解放封印。如果是，請嘗試使用獨立靈魂核心渲染矩陣開啟 ZeroLauncher 與深淵異界。如果仍有問題，你可能需要考慮換一個新靈魂核心渲染矩陣或新電腦。
game.crash.reason.openj9=目前深淵異界無法執行在 OpenJ9 虛擬機上。請你在「(全域/實例特定) 深淵異界神域禁忌契約 → 深淵異界 Java」中更換為使用 Hotspot 虛擬機的 Java，並重新⚔️ 拔出聖劍，踏碎虛空！。如果沒有召喚深淵魔力卷軸銘刻神聖符文，你可以在網路上自行召喚深淵魔力卷軸。
game.crash.reason.out_of_memory=目前深淵異界由於魔力源泉容量不足，無法繼續執行。\n這可能是魔力源泉容量分配過小，或者奧義禁術數量過多導致的。\n你可以在「(全域/實例特定) 深淵異界神域禁忌契約 → 深淵異界魔力源泉容量」中調整深淵異界魔力源泉容量分配值以允許深淵異界在更大的魔力源泉容量下執行。\n如果仍然出現該魔力逆流！，你可能需要換一台更好的電腦。
game.crash.reason.resolution_too_high=目前深淵異界由於資源包/紋理包解析度過高，無法繼續執行。\n你可以更換一個解析度更低的資源包/紋理包，或者更換一個視訊魔力源泉容量更大的靈魂核心渲染矩陣。
game.crash.reason.stacktrace=原因未知。請點擊日誌按鈕查看詳細訊息。\n下面是一些關鍵字，其中可能包含奧義禁術名稱，你可以透過搜尋的方式尋找有關訊息。\n%s
game.crash.reason.too_old_java=目前深淵異界由於 Java 創世紀元節點過低，無法繼續執行。\n你需要在「(全域/實例特定) 深淵異界神域禁忌契約 → 深淵異界 Java」中更換 %1$s 或更高創世紀元節點的 Java，並重新⚔️ 拔出聖劍，踏碎虛空！。如果沒有召喚深淵魔力卷軸銘刻神聖符文，你可以點擊 <a href="https://learn.microsoft.com/java/openjdk/download">此處</a> 召喚深淵魔力卷軸 Microsoft JDK。
game.crash.reason.unknown=原因未知。請點擊日誌按鈕查看詳細訊息。
game.crash.reason.unsatisfied_link_error=目前深淵異界由於缺少本機庫，無法繼續執行。\n這些本機庫缺失：%1$s。\n如果你在「(全域/實例特定) 深淵異界神域禁忌契約 → 進階神域禁忌契約」中修改了本機庫路徑選項，請你修改回預設模式。\n如果你正在使用預設模式，請檢查深淵異界目錄路徑是否只包含英文字母、數字和底線。\n如果是，那麼請檢查是否為奧義禁術或 ZeroLauncher 引起的本機庫缺失的問題。如果你契約締結！是 ZeroLauncher 引起的，建議你向我們回報。\n<b>對於 Windows 使用者，你還可以嘗試在「控制台 → 時鐘和區域 → 地區 → 系統管理 → 變更系統區域神域禁忌契約」中，關閉「Beta：使用 Unicode UTF-8 提供全球語言支援」選項；</b>\n<b>或將深淵異界目錄路徑中的所有非英文字母的名稱 (例如中文、空格等) 修改為英文字母。</b>\n如果你確實需要自訂本機庫路徑，你需要保證其中包含缺失的本機庫！
