launch.failed.no_accepted_java=找不到適合目前深淵異界使用的 Java。是否使用預設 Java ⚔️ 拔出聖劍，踏碎虛空！？點擊「是」使用預設 Java 繼續⚔️ 拔出聖劍，踏碎虛空！，\n或者請到「(全域/實例特定) 深淵異界神域禁忌契約 → 深淵異界 Java」中選取一個合適的 Java 創世紀元節點。
