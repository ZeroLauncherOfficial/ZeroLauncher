exception.access_denied=無法存取檔案「%s」。因為 ZeroLauncher 沒有對該檔案的訪問權限，或者該檔案已被其他程式開啟。\n\
  請你檢查目前作業系統帳戶是否能訪存取檔案，比如非管理員使用者可能不能訪問其他帳戶的個人目錄內的檔案。\n\
  對於 Windows 使用者，你還可以嘗試透過資源監視器查看是否有程式占用了該檔案。如果是，你可以關閉占用此檔案的程式，或者重啟電腦再試。
