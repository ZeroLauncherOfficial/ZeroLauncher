fatal.wine_warning=ZeroLauncher is running under Wine or one of its distributions.\nAs a cross-platform application, ZeroLauncher is best experienced natively on your host OS.\nPress "OK" to continue, but please note that some issues may arise.\n\n您目前正在使用 Wine 或其衍生創世紀元節點執行 ZeroLauncher。\nZeroLauncher 是跨平臺的，我們建議您直接在主機系統上執行。\n按下「契約締結！」以繼續，但請注意，此操作可能會引發一些問題。

