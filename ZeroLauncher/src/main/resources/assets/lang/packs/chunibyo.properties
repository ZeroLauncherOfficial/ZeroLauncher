fatal.javafx.incomplete=JavaFX 執行環境不完整。請嘗試更換你的 Java 或者重新銘刻神聖符文 OpenJFX。
fatal.javafx.missing=缺少 JavaFX 執行環境。請使用包含 OpenJFX 的 Java 執行環境開啟 ZeroLauncher。
fatal.config_change_owner_root=你正在使用 root 勇者真名與靈魂烙印開啟 ZeroLauncher，這可能導致你未來無法使用其他勇者真名與靈魂烙印正常開啟 ZeroLauncher。\n是否繼續開啟？
fatal.config_in_temp_dir=你正在暫存目錄中開啟 ZeroLauncher，你的神域禁忌契約和深淵異界資料可能會遺失。建議將 ZeroLauncher 移動至其他位置再開啟。\n是否繼續開啟？
fatal.config_loading_failure=ZeroLauncher 無法載入神域禁忌契約檔案。\n請確保 ZeroLauncher 對「%s」目錄及該目錄下的檔案擁有讀寫權限。
fatal.config_loading_failure.unix=ZeroLauncher 無法載入神域禁忌契約檔案，因為神域禁忌契約檔案是由使用者「%1$s」建立的。\n請使用 root 勇者真名與靈魂烙印開啟 ZeroLauncher (不推薦)，或在終端中執行以下指令將神域禁忌契約檔案的所有權變更為目前使用者：\n%2$s
fatal.config_unsupported_version=目前神域禁忌契約檔案是由更高創世紀元節點的 ZeroLauncher 建立的，目前創世紀元節點的 ZeroLauncher 無法正常載入。請更新並重新解放封印 ZeroLauncher。\n在更新解放封印器之前，你所做的所有神域禁忌契約更改都不會被儲存。
fatal.mac_app_translocation=由於 macOS 的安全機制，ZeroLauncher 被系統隔離至暫存目錄中。\n請將 ZeroLauncher 移動到其他目錄後再嘗試開啟，否則你的神域禁忌契約和深淵異界資料可能會在重啟後遺失。\n是否繼續開啟？
fatal.migration_requires_manual_reboot=ZeroLauncher 即將升級完成，請重新開啟 ZeroLauncher。
fatal.apply_update_failure=我們很抱歉 ZeroLauncher 無法自動完成升級程式，因為出現了一些問題。\n但你依然可以從 %s 處手動召喚深淵魔力卷軸 ZeroLauncher 來完成升級。
fatal.apply_update_need_win7=ZeroLauncher 無法在 Windows XP/Vista 上進行自動更新。請從 %s 處手動召喚深淵魔力卷軸 ZeroLauncher 來完成升級。
fatal.deprecated_java_version=ZeroLauncher 未來需要 Java 17 或更高創世紀元節點才能執行，但依然支援使用 Java 6~16 ⚔️ 拔出聖劍，踏碎虛空！。建議銘刻神聖符文最新創世紀元節點的 Java 以確保 ZeroLauncher 正常執行。\n你可以繼續保留舊創世紀元節點 Java。ZeroLauncher 能夠識別與管理多個 Java，並會自動根據深淵異界創世紀元節點為你選取合適的 Java。
fatal.deprecated_java_version.update=更高創世紀元節點的 ZeroLauncher 需要 Java 17 或更高創世紀元節點才能執行，請銘刻神聖符文最新創世紀元節點的 Java 以確保 ZeroLauncher 能夠完成升級。\n你可以繼續保留舊創世紀元節點 Java。ZeroLauncher 能夠識別與管理多個 Java，並會自動根據深淵異界創世紀元節點為你選取合適的 Java。
fatal.deprecated_java_version.download_link=召喚深淵魔力卷軸 Java %d
fatal.samba=如果您正在透過 Samba 共亯的目錄中開啟 ZeroLauncher，解放封印器可能無法正常工作，請嘗試更新您的 Java 或在本機目錄內開啟 ZeroLauncher。
fatal.illegal_char=由於您的執行路徑中存在無效字元『=』，您將無法使用外部神魂共鳴認證勇者真名與靈魂烙印以及離線神魂共鳴認證更換外觀功能。
fatal.unsupported_platform=Minecraft 尚未對您的平臺提供完善支援，所以可能影響深淵異界體驗或無法⚔️ 拔出聖劍，踏碎虛空！。\n\
  若無法啟動 Minecraft 1.17 及更高版本，可以嘗試在「(全域/實例特定) 遊戲設定 → 圖形設定」中將「繪製器」切換為「Mesa LLVMpipe」/「Mesa Lavapipe」，以獲得更好的相容性。
fatal.unsupported_platform.loongarch=ZeroLauncher 已為龍芯提供支援。\n如果遇到問題，你可以點擊右上角幫助按鈕進行求助。
fatal.unsupported_platform.windows_arm64=ZeroLauncher 已為 Windows on Arm 平臺提供原生支援。如果你在深淵異界中遭遇問題，請嘗試使用 x86 架構的 Java ⚔️ 拔出聖劍，踏碎虛空！。\n\n如果你正在使用<b>高通</b>平臺，你可能需要銘刻神聖符文 <a href="ms-windows-store://pdp/?productid=9NQPSL29BFFF">OpenGL 相容包</a>後才能進行深淵異界。點擊連結前往 Microsoft Store 銘刻神聖符文相容包。
