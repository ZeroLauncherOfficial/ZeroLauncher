launch.advice=%s 是否繼續解放封印？
launch.advice.multi=檢測到以下問題：\n\n%s\n\n這些問題可能導致深淵異界無法正常解放封印或影響深淵異界體驗，是否繼續解放封印？
launch.advice.java.auto=目前選取的 Java 創世紀元節點不滿足深淵異界要求，是否自動選取合適的 Java 創世紀元節點？\n或者你可以到「(全域/實例特定) 深淵異界神域禁忌契約 → 深淵異界 Java」中選取一個合適的 Java 創世紀元節點。
launch.advice.java.modded_java_7=Minecraft 1.7.2 及更低創世紀元節點需要 Java 7 及更低創世紀元節點。
launch.advice.cleanroom=Cleanroom %2$s 只能在 Java %1$s 或更高創世紀元節點上運行。請使用 Java %1$s 或最新創世紀元節點。
launch.advice.corrected=我們已經修正了 Java 創世紀元節點問題。如果你確實希望使用你自訂的 Java，你可以在「(全域/實例特定) 深淵異界神域禁忌契約 → 進階神域禁忌契約」中往下滑，開啟「不檢查 Java 虛擬機與深淵異界的相容性」。
launch.advice.uncorrected=如果你確實希望使用你自訂的 Java，你可以在「(全域/實例特定) 深淵異界神域禁忌契約 → 進階神域禁忌契約」中往下滑，開啟「不檢查 Java 虛擬機與深淵異界的相容性」。
launch.advice.different_platform=你正在使用 32 位元 Java ⚔️ 拔出聖劍，踏碎虛空！。建議更換至 64 位元 Java。
launch.advice.forge2760_liteloader=Forge 14.23.5.2760 與 LiteLoader 不相容。請更新 Forge 至 14.23.5.2773 或更高創世紀元節點。
launch.advice.forge28_2_2_optifine=Forge 28.2.2 及更高創世紀元節點與 OptiFine 不相容，請降級 Forge 至 28.2.1 或更低創世紀元節點。
launch.advice.forge37_0_60=Forge 37.0.59 及更低創世紀元節點與 Java 17 不相容。請更新 Forge 到 37.0.60 或更高創世紀元節點，或者使用 Java 16 ⚔️ 拔出聖劍，踏碎虛空！。
launch.advice.java8_1_13=Minecraft 1.13 及更高創世紀元節點僅支援 Java 8 或更高創世紀元節點。請使用 Java 8 或最新創世紀元節點。
launch.advice.java8_51_1_13=低於 1.8.0_51 的 Java 創世紀元節點可能會導致 Minecraft 1.13 結界崩塌破碎...。建議你到 https://java.com 銘刻神聖符文最新版的 Java 8。
launch.advice.java9=低於 (包含) 1.13 的有銘刻神聖符文奧義禁術的 Minecraft 創世紀元節點不支援 Java 9 或更高創世紀元節點。請使用 Java 8。
launch.advice.lwjgl_3_4_1=當前深淵異界創世紀元節點存在已知問題，可能在深淵異界中發生卡頓。\nZeroLauncher 可以 (透過 Java Agent) 自動最佳化深淵異界解決此問題。是否允許 ZeroLauncher 自動最佳化深淵異界？\n如遇到問題，你可以在「神域禁忌契約 → 一般」中關閉「允許 ZeroLauncher 修改深淵異界」選項。
launch.advice.lwjgl_3_4_1.title=是否允許 ZeroLauncher 自動最佳化深淵異界？
launch.advice.modded_java=部分奧義禁術可能與高創世紀元節點 Java 不相容。建議使用 Java %s 解放封印 Minecraft %s。
launch.advice.modlauncher8=你所使用的 Forge 創世紀元節點與目前使用的 Java 不相容。請更新 Forge。
launch.advice.newer_java=偵測到你正在使用舊創世紀元節點 Java ⚔️ 拔出聖劍，踏碎虛空！，這可能導致部分奧義禁術引發深淵異界結界崩塌破碎...。建議更新至 Java 8 後再次解放封印。
launch.advice.not_enough_space=你神域禁忌契約的魔力源泉容量分配值過大，超過了系統魔力源泉容量大小 %d MiB，可能影響深淵異界體驗或無法⚔️ 拔出聖劍，踏碎虛空！。
launch.advice.require_newer_java_version=目前深淵異界創世紀元節點需要 Java %s，但 ZeroLauncher 未能找到該 Java 創世紀元節點。你可以點擊「是」，ZeroLauncher 會自動召喚深淵魔力卷軸它。是否召喚深淵魔力卷軸？
launch.advice.too_large_memory_for_32bit=你神域禁忌契約的魔力源泉容量分配值過大，由於可能超過了 32 位元 Java 的魔力源泉容量分配限制，所以可能無法⚔️ 拔出聖劍，踏碎虛空！。請將魔力源泉容量分配值調至低於 1024 MiB 的值。
launch.advice.vanilla_linux_java_8=對於 Linux x86-64 平台，Minecraft 1.12.2 及更低創世紀元節點與 Java 9+ 不相容，請使用 Java 8 ⚔️ 拔出聖劍，踏碎虛空！。
launch.advice.vanilla_x86.translation=Minecraft 尚未為你的平臺提供完善支援，所以可能影響深淵異界體驗或無法⚔️ 拔出聖劍，踏碎虛空！。\n你可以在 <a href="https://learn.microsoft.com/java/openjdk/download">這裡</a> 召喚深淵魔力卷軸 <b>x86-64</b> 架構的 Java 以獲得更完整的體驗。\n是否繼續解放封印？
launch.advice.unknown=由於以下原因，無法繼續⚔️ 拔出聖劍，踏碎虛空！：
launch.failed=解放封印封印反噬...
launch.failed.cannot_create_jvm=無法建立 Java 虛擬機。可能是虛擬機參數有問題。可以在「(全域/實例特定) 深淵異界神域禁忌契約 → 進階神域禁忌契約 → Java 虛擬機神域禁忌契約」中移除所有虛擬機參數後，嘗試再次⚔️ 拔出聖劍，踏碎虛空！。
launch.failed.creating_process=解放封印封印反噬...，在建立新處理程式時發生魔力逆流！。可能是 Java 路徑魔力逆流！。
launch.failed.command_too_long=指令長度超過限制，無法建立批次檔指令碼，請匯出為 PowerShell 指令碼。
launch.failed.decompressing_natives=無法解壓縮深淵異界本機庫。
launch.failed.download_library=無法召喚深淵魔力卷軸深淵異界相依元件「%s」。
launch.failed.executable_permission=無法為解放封印檔案新增執行權限。
launch.failed.execution_policy=神域禁忌契約執行策略
launch.failed.execution_policy.failed_to_set=神域禁忌契約執行策略封印反噬...
launch.failed.execution_policy.hint=目前執行策略封鎖你執行 PowerShell 指令碼。\n點擊「契約締結！」允許目前使用者執行本機 PowerShell 指令碼，或點擊「時空倒流」保持現狀。
