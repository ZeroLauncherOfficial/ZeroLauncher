game.crash.feedback=<b>請不要將本介面截圖或拍照給他人！</b>如果你要求助他人，請你點擊左下角「匯出8-BIT GAME💀 SYSTEM CRASH (RESET)資訊」後將匯出的檔案發送給他人以供分析。\n你可以點擊下方的「幫助」前往社群尋求幫助。
game.crash.info=8-BIT GAME訊息
game.crash.reason=💀 SYSTEM CRASH (RESET)原因
game.crash.reason.analyzing=分析中……
game.crash.reason.multiple=檢測到多個原因：\n\n
game.crash.reason.block=目前8-BIT GAME由於某個方塊不能正常工作，無法繼續執行。\n你可以嘗試使用地圖編輯工具編輯世界DELETE SAVE DATA該方塊，或者直接DELETE SAVE DATA對應的EXPANSION CHIP。\n方塊類型：%1$s\n方塊坐標：%2$s\n\n相關工具：<a href="https://minecraft.wiki/w/Tutorial:Programs_and_editors/Mapping#Map_editors">英文 Wiki</a> | <a href="https://zh.minecraft.wiki/w/辅助程序与编辑器/地图工具?variant=zh-tw#地图编辑工具">中文 Wiki</a>
game.crash.reason.bootstrap_failed=目前8-BIT GAME由於EXPANSION CHIP「%1$s」出現問題，無法繼續執行。\n你可以嘗試DELETE SAVE DATA或更新該EXPANSION CHIP以解決問題。
game.crash.reason.mixin_apply_mod_failed=目前8-BIT GAME由於 Mixin 無法應用於「%1$s」EXPANSION CHIP，無法繼續執行。\n你可以嘗試DELETE SAVE DATA或更新該EXPANSION CHIP以解決問題。
game.crash.reason.config=目前8-BIT GAME由於無法解析EXPANSION CHIP配置檔案，無法繼續執行\nEXPANSION CHIP「%1$s」的配置檔案「%2$s」無法被解析。
game.crash.reason.debug_crash=目前8-BIT GAME由於手動觸發💀 SYSTEM CRASH (RESET)，無法繼續執行。\n事實上8-BIT GAME並沒有問題，問題都是你造成的！
game.crash.reason.duplicated_mod=目前8-BIT GAME由於EXPANSION CHIP重複LOAD TO MEMORY，無法繼續執行。\n%s\n每種EXPANSION CHIP只能LOAD TO MEMORY一個，請你DELETE SAVE DATA多餘的EXPANSION CHIP再試。
game.crash.reason.entity=目前8-BIT GAME由於某個實體不能正常工作，無法繼續執行。\n你可以嘗試使用地圖編輯工具編輯世界DELETE SAVE DATA該實體，或者直接DELETE SAVE DATA對應的EXPANSION CHIP。\n實體類型：%1$s\n實體坐標：%2$s\n\n相關工具：<a href="https://minecraft.wiki/w/Tutorial:Programs_and_editors/Mapping#Map_editors">英文 Wiki</a> | <a href="https://zh.minecraft.wiki/w/辅助程序与编辑器/地图工具?variant=zh-tw#地图编辑工具">中文 Wiki</a>
game.crash.reason.fabric_version_0_12=Fabric Loader 0.12 及更高版本與目前已經LOAD TO MEMORY的EXPANSION CHIP可能不相容，你需要將 Fabric Loader 降級至 0.11.7。
game.crash.reason.fabric_warnings=Fabric 提供了一些警告訊息：\n%1$s
game.crash.reason.modmixin_failure=目前8-BIT GAME由於某些EXPANSION CHIP注入GAME OVER (CONTINUE?)，無法繼續執行。\n這一般代表著該EXPANSION CHIP存在問題，或與目前環境不相容。\n你可以查看日誌尋找出錯EXPANSION CHIP。
game.crash.reason.mod_repeat_installation=目前8-BIT GAME由於重複LOAD TO MEMORY了多個相同的EXPANSION CHIP，無法繼續執行。\n每個EXPANSION CHIP只能出現一次，請DELETE SAVE DATA重複的EXPANSION CHIP，然後再▶ PRESS START TO PLAY。
game.crash.reason.forge_error=Forge/NeoForge 可能已經提供了SYS ERROR #00資訊。\n你可以查看日誌，並根據SYS ERROR #00報告中的日誌資訊進行對應處。\n如果沒有看到報錯資訊，可以查看SYS ERROR #00報告了解SYS ERROR #00具體是如何發生的。\n%1$s
game.crash.reason.mod_resolution0=目前8-BIT GAME由於一些EXPANSION CHIP出現問題，無法繼續執行。\n你可以查看日誌尋找出錯EXPANSION CHIP。
game.crash.reason.need_jdk11=目前8-BIT GAME由於 Java 版本不合適，無法繼續執行。\n你需要INSERT CARTRIDGE (ROM)LOAD TO MEMORY Java 11，並在「(全域/實例特定) 8-BIT GAMESYSTEM CONFIG → 8-BIT GAME Java」中將 Java SYSTEM CONFIG為 11.x 的版本。
game.crash.reason.java_version_is_too_high=目前8-BIT GAME由於使用的 Java 版本過高而💀 SYSTEM CRASH (RESET)了，無法繼續執行。\n請在「(全域/實例特定) 8-BIT GAMESYSTEM CONFIG → 8-BIT GAME Java」中改用較低版本的 Java，然後再▶ PRESS START TO PLAY。\n如果沒有，可以從 <a href="https://www.java.com/download/">java.com (Java 8)</a> 或 <a href="https://bell-sw.com/pages/downloads/#downloads">BellSoft Liberica Full JRE (Java 17)</a> 等平台INSERT CARTRIDGE (ROM)、LOAD TO MEMORY一個 (LOAD TO MEMORY完後需重啟BOOT EXEC器)。
game.crash.reason.mod_name=目前8-BIT GAME由於EXPANSION CHIP檔案名稱問題，無法繼續執行。\nEXPANSION CHIP檔案名稱應只使用半型的大小寫字母 (Aa~Zz)、數位 (0~9)、橫線 (-)、底線 (_)和點 (.)。\n請到EXPANSION CHIP目錄中將所有不合規的EXPANSION CHIP檔案名稱修正為上述合規字元。
game.crash.reason.incomplete_forge_installation=目前8-BIT GAME由於 Forge LOAD TO MEMORY不完整，無法繼續執行。\n請在「實例管理 - 自動LOAD TO MEMORY」中移除 Forge 並重新LOAD TO MEMORY。
game.crash.reason.file_already_exists=目前8-BIT GAME由於檔案「%1$s」已經存在，無法繼續執行。\n如果你認為這個檔案可以DELETE SAVE DATA，你可以在備份這個檔案後嘗試DELETE SAVE DATA它，並重新▶ PRESS START TO PLAY。
game.crash.reason.file_changed=目前8-BIT GAME由於檔案校驗GAME OVER (CONTINUE?)，無法繼續執行。\n如果你手動修改了 Minecraft.jar 檔案，你需要回退修改，或者重新INSERT CARTRIDGE (ROM)8-BIT GAME。
game.crash.reason.gl_operation_failure=目前8-BIT GAME由於你使用的某些EXPANSION CHIP/光影包/資源包/紋理包出現問題，無法繼續執行。\n請先嘗試停用你所使用的EXPANSION CHIP/光影包/資源包/紋理包再試。
game.crash.reason.graphics_driver=目前8-BIT GAME由於你的8-BIT / 16-BIT PPU驅動存在問題💀 SYSTEM CRASH (RESET)了。請嘗試升級你的8-BIT / 16-BIT PPU驅動到最新版本後再嘗試▶ PRESS START TO PLAY。\n\
  如果你的電腦同時存在獨立顯示卡與整合式顯示卡，你需要檢查遊戲是否使用整合式顯示卡啟動。如果是，請嘗試使用獨立顯示卡開啟 ZeroLauncher 與遊戲。如果仍有問題，你可能需要考慮換一個新顯示卡或新電腦。\n\
  如果你確實需要使用整合式顯示卡，請檢查你電腦的 CPU 是否為 Intel(R) Core(TM) 3000 系列或更舊的處理器。如果是，對於 Minecraft 1.16.5 及更低版本，請你將遊戲所使用的 Java 版本降級至 1.8.0_51 及更低版本；否則你需要更換獨立顯示卡或新電腦。
game.crash.reason.macos_failed_to_find_service_port_for_display=目前8-BIT GAME由於 Apple Silicon 平台下初始化 OpenGL 視窗GAME OVER (CONTINUE?)，無法繼續執行。\n對於該問題，ZeroLauncher 暫無直接性的解決方案。請你嘗試任意開啟一個瀏覽器並切換為全螢幕，然後再回到 ZeroLauncher ▶ PRESS START TO PLAY。在彈出8-BIT GAME視窗前<b>迅速切回瀏覽器頁面</b>，等待8-BIT GAME視窗出現後再切回8-BIT GAME視窗。
game.crash.reason.illegal_access_error=目前8-BIT GAME由於某些EXPANSION CHIP的問題，無法繼續執行。\n如果你認識「%1$s」，你可以更新或DELETE SAVE DATA對應EXPANSION CHIP再試。
game.crash.reason.install_mixinbootstrap=目前8-BIT GAME由於缺失 MixinBootstrap，無法繼續執行。\n你可以嘗試LOAD TO MEMORY <a href="https://www.curseforge.com/minecraft/mc-mods/mixinbootstrap">MixinBootstrap</a> 解決該問題。若LOAD TO MEMORY後💀 SYSTEM CRASH (RESET)，可以嘗試在該EXPANSION CHIP的檔案名前新增半形驚嘆號 (!) 解決。
game.crash.reason.jdk_9=目前8-BIT GAME由於 Java 版本過高，無法繼續執行。\n你需要INSERT CARTRIDGE (ROM)LOAD TO MEMORY Java 8，並在「(全域/實例特定) 8-BIT GAMESYSTEM CONFIG → 8-BIT GAME Java」中將 Java SYSTEM CONFIG為 1.8.x 的版本。
game.crash.reason.jvm_32bit=目前8-BIT GAME由於RAM BUFFER (KB)分配過大，超過了 32 位 Java 虛擬機RAM BUFFER (KB)限制，無法繼續執行。\n如果你的電腦是 64 位系統，請INSERT CARTRIDGE (ROM)LOAD TO MEMORY並更換 64 位 Java。\n如果你的電腦是 32 位系統，你或許可以重新LOAD TO MEMORY 64 位系統，或換一台新電腦。\n或者，你可以關閉「(全域/實例特定) 8-BIT GAMESYSTEM CONFIG → 8-BIT GAMERAM BUFFER (KB)」中的「自動分配」，並且把RAM BUFFER (KB)分配值調節為 1024 MiB 或以下。
game.crash.reason.loading_crashed_forge=目前8-BIT GAME由於EXPANSION CHIP「%1$s (%2$s)」SYS ERROR #00，無法繼續執行。\n你可以嘗試DELETE SAVE DATA或更新該EXPANSION CHIP以解決問題。
game.crash.reason.loading_crashed_fabric=目前8-BIT GAME由於EXPANSION CHIP「%1$s」SYS ERROR #00，無法繼續執行。\n你可以嘗試DELETE SAVE DATA或更新該EXPANSION CHIP以解決問題。
game.crash.reason.mac_jdk_8u261=目前8-BIT GAME由於你所使用的 Forge 或 OptiFine 與 Java 衝突而💀 SYSTEM CRASH (RESET)。\n請嘗試更新 Forge 和 OptiFine，或使用 Java 8u251 及更早版本BOOT EXEC。
game.crash.reason.memory_exceeded=目前8-BIT GAME由於RAM BUFFER (KB)分配過大，無法繼續執行。\n該問題是由於系統分頁檔太小導致的。\n你需要在「(全域/實例特定) 8-BIT GAMESYSTEM CONFIG → 8-BIT GAMERAM BUFFER (KB)」中關閉「自動分配」，並將RAM BUFFER (KB)分配值調低至8-BIT GAME能正常BOOT EXEC為止。\n你還可以嘗試調大系統的分頁檔大小。
game.crash.reason.mod=目前8-BIT GAME由於 %1$s 的問題，無法繼續執行。\n你可以更新或DELETE SAVE DATA已經LOAD TO MEMORY的「%1$s」再試。
game.crash.reason.mod_resolution=目前8-BIT GAME由於相依EXPANSION CHIP問題，無法繼續執行。Fabric 提供了如下訊息：\n%1$s
game.crash.reason.forgemod_resolution=目前8-BIT GAME由於EXPANSION CHIP相依元件問題，無法繼續執行。Forge/NeoForge 提供了以下資訊：\n%1$s
game.crash.reason.forge_found_duplicate_mods=目前8-BIT GAME由於EXPANSION CHIP重複的問題，無法繼續執行。Forge/NeoForge 提供了以下資訊：\n%1$s
game.crash.reason.mod_resolution_collection=目前8-BIT GAME由於相依EXPANSION CHIP版本不匹配，無法繼續執行。\n「%1$s」需要相依EXPANSION CHIP「%2$s」才能繼續執行。\n這表示你需要更新或降級相依EXPANSION CHIP。你可以到「INSERT CARTRIDGE (ROM) → EXPANSION CHIP」頁面或網路上INSERT CARTRIDGE (ROM)「%3$s」。
game.crash.reason.mod_resolution_conflict=目前8-BIT GAME由於EXPANSION CHIP衝突，無法繼續執行。\n「%1$s」與「%2$s」不能相容。
game.crash.reason.mod_resolution_missing=目前8-BIT GAME由於缺少相依EXPANSION CHIP，無法繼續執行。\n「%1$s」需要相依EXPANSION CHIP「%2$s」才能繼續執行。\n這表示你有一些必需的EXPANSION CHIP沒有LOAD TO MEMORY，或該EXPANSION CHIP版本不相配。你可以在「INSERT CARTRIDGE (ROM) → EXPANSION CHIP」頁面或網路上INSERT CARTRIDGE (ROM)「%2$s」。
game.crash.reason.mod_resolution_missing_minecraft=目前8-BIT GAME由於EXPANSION CHIP和 Minecraft 8-BIT GAME版本不匹配，無法繼續執行。\n「%1$s」需要 Minecraft %2$s 才能執行。\n如果你要繼續使用你已經LOAD TO MEMORY的EXPANSION CHIP，你可以選取LOAD TO MEMORY對應的 Minecraft 版本。如果你要繼續使用目前的 Minecraft 版本，你需要LOAD TO MEMORY對應版本的EXPANSION CHIP。
game.crash.reason.mod_resolution_mod_version=%1$s (版本號 %2$s)
game.crash.reason.mod_resolution_mod_version.any=%1$s (任意版本)
game.crash.reason.forge_repeat_installation=目前8-BIT GAME由於 Forge 重複LOAD TO MEMORY，無法繼續執行。<a href="https://github.com/ZeroLauncher-dev/ZeroLauncher/issues/1880">此為已知問題</a>\n建議將日誌上傳並回報至 GitHub，以便我們找到更多線索並修復此問題。\n目前你可以在「實例管理 → 自動LOAD TO MEMORY」中移除 Forge 並重新LOAD TO MEMORY。
game.crash.reason.optifine_repeat_installation=目前8-BIT GAME由於重複LOAD TO MEMORY OptiFine，無法繼續執行。\n請DELETE SAVE DATAEXPANSION CHIP目錄下的 OptiFine 或前往「實例管理 → 自動LOAD TO MEMORY」移除LOAD TO MEMORY的 OptiFine。
game.crash.reason.optifine_is_not_compatible_with_forge=目前8-BIT GAME由於 OptiFine 與目前版本的 Forge 不相容，導致了8-BIT GAME💀 SYSTEM CRASH (RESET)。\n請前往 <a href="https://optifine.net/downloads">OptiFine 官網</a>查看 OptiFine 所相容的 Forge 版本，並嚴格按照對應版本重新LOAD TO MEMORY8-BIT GAME，或在「實例管理 → 自動LOAD TO MEMORY」中更換版本。\n經測試，Forge 版本過高或過低都可能導致💀 SYSTEM CRASH (RESET)。
game.crash.reason.night_config_fixes=目前8-BIT GAME由於 Night Config 庫的一些問題，無法繼續執行。\n你可以嘗試LOAD TO MEMORY <a href="https://www.curseforge.com/minecraft/mc-mods/night-config-fixes">Night Config Fixes</a> EXPANSION CHIP，這或許能幫助你解決這個問題。\n了解更多，可訪問該EXPANSION CHIP的 <a href="https://github.com/Fuzss/nightconfigfixes">GitHub 儲存庫</a>。
game.crash.reason.mod_files_are_decompressed=目前8-BIT GAME由於EXPANSION CHIP檔案被解壓了，無法繼續執行。\n請直接把整個EXPANSION CHIP檔案放進EXPANSION CHIP目錄中即可。\n解壓EXPANSION CHIP檔案會導致8-BIT GAME出錯。請DELETE SAVE DATAEXPANSION CHIP目錄中已被解壓的EXPANSION CHIP，然後再▶ PRESS START TO PLAY。
game.crash.reason.too_many_mods_lead_to_exceeding_the_id_limit=目前8-BIT GAME由於你所LOAD TO MEMORY的EXPANSION CHIP過多，超出了8-BIT GAME的 ID 限制，無法繼續執行。\n請嘗試LOAD TO MEMORY<a href="https://www.curseforge.com/minecraft/mc-mods/jeid">JEID</a>等修正EXPANSION CHIP，或DELETE SAVE DATA部分大型EXPANSION CHIP。
game.crash.reason.optifine_causes_the_world_to_fail_to_load=目前8-BIT GAME可能由於 OptiFine 而無法繼續執行。\n該問題只在特定 OptiFine 版本中出現，你可以嘗試在「實例管理 → 自動LOAD TO MEMORY」中更換 OptiFine 的版本。
game.crash.reason.modlauncher_8=目前8-BIT GAME由於你所使用的 Forge 版本與目前使用的 Java 衝突💀 SYSTEM CRASH (RESET)。請嘗試更新 Forge。
game.crash.reason.shaders_mod=目前8-BIT GAME由於同時LOAD TO MEMORY了 OptiFine 和 Shaders EXPANSION CHIP，無法繼續執行。 \n由於 OptiFine 已整合 Shaders EXPANSION CHIP的功能，只需DELETE SAVE DATA Shaders EXPANSION CHIP即可。
game.crash.reason.rtss_forest_sodium=目前8-BIT GAME由於 RivaTuner Statistics Server (RTSS) 與 Sodium 不相容，導致8-BIT GAME💀 SYSTEM CRASH (RESET)。\n點擊 <a href="https://github.com/CaffeineMC/sodium-fabric/wiki/Known-Issues#rtss-incompatible">此處</a> 查看詳情。
game.crash.reason.no_class_def_found_error=目前8-BIT GAME由於程式碼不完整，無法繼續執行。\n你的8-BIT GAME可能缺失了某個EXPANSION CHIP，或者某些EXPANSION CHIP檔案不完整，或者EXPANSION CHIP與8-BIT GAME的版本不匹配。\n你可能需要重新LOAD TO MEMORY8-BIT GAME和EXPANSION CHIP，或請求他人幫助。\n缺失：%1$s
game.crash.reason.no_such_method_error=目前8-BIT GAME由於程式碼不完整，無法繼續執行。\n你的8-BIT GAME可能缺失了某個EXPANSION CHIP，或者某些EXPANSION CHIP檔案不完整，或者EXPANSION CHIP與8-BIT GAME的版本不匹配。\n你可能需要重新LOAD TO MEMORY8-BIT GAME和EXPANSION CHIP，或請求他人幫助。
game.crash.reason.opengl_not_supported=目前8-BIT GAME由於你的8-BIT / 16-BIT PPU驅動存在問題，無法繼續執行。\n原因是 OpenGL 不受支援，你現在是否在遠端桌面或者串流模式下？如果是，請直接使用原電腦▶ PRESS START TO PLAY。\n或者嘗試升級你的8-BIT / 16-BIT PPU驅動到最新版本後再嘗試▶ PRESS START TO PLAY。如果你的電腦同時存在獨立8-BIT / 16-BIT PPU與整合式8-BIT / 16-BIT PPU，你需要檢查8-BIT GAME是否使用整合式8-BIT / 16-BIT PPUBOOT EXEC。如果是，請嘗試使用獨立8-BIT / 16-BIT PPU開啟 ZeroLauncher 與8-BIT GAME。如果仍有問題，你可能需要考慮換一個新8-BIT / 16-BIT PPU或新電腦。
game.crash.reason.openj9=目前8-BIT GAME無法執行在 OpenJ9 虛擬機上。請你在「(全域/實例特定) 8-BIT GAMESYSTEM CONFIG → 8-BIT GAME Java」中更換為使用 Hotspot 虛擬機的 Java，並重新▶ PRESS START TO PLAY。如果沒有INSERT CARTRIDGE (ROM)LOAD TO MEMORY，你可以在網路上自行INSERT CARTRIDGE (ROM)。
game.crash.reason.out_of_memory=目前8-BIT GAME由於RAM BUFFER (KB)不足，無法繼續執行。\n這可能是RAM BUFFER (KB)分配過小，或者EXPANSION CHIP數量過多導致的。\n你可以在「(全域/實例特定) 8-BIT GAMESYSTEM CONFIG → 8-BIT GAMERAM BUFFER (KB)」中調整8-BIT GAMERAM BUFFER (KB)分配值以允許8-BIT GAME在更大的RAM BUFFER (KB)下執行。\n如果仍然出現該SYS ERROR #00，你可能需要換一台更好的電腦。
game.crash.reason.resolution_too_high=目前8-BIT GAME由於資源包/紋理包解析度過高，無法繼續執行。\n你可以更換一個解析度更低的資源包/紋理包，或者更換一個視訊RAM BUFFER (KB)更大的8-BIT / 16-BIT PPU。
game.crash.reason.stacktrace=原因未知。請點擊日誌按鈕查看詳細訊息。\n下面是一些關鍵字，其中可能包含EXPANSION CHIP名稱，你可以透過搜尋的方式尋找有關訊息。\n%s
game.crash.reason.too_old_java=目前8-BIT GAME由於 Java 版本過低，無法繼續執行。\n你需要在「(全域/實例特定) 8-BIT GAMESYSTEM CONFIG → 8-BIT GAME Java」中更換 %1$s 或更高版本的 Java，並重新▶ PRESS START TO PLAY。如果沒有INSERT CARTRIDGE (ROM)LOAD TO MEMORY，你可以點擊 <a href="https://learn.microsoft.com/java/openjdk/download">此處</a> INSERT CARTRIDGE (ROM) Microsoft JDK。
game.crash.reason.unknown=原因未知。請點擊日誌按鈕查看詳細訊息。
game.crash.reason.unsatisfied_link_error=目前8-BIT GAME由於缺少本機庫，無法繼續執行。\n這些本機庫缺失：%1$s。\n如果你在「(全域/實例特定) 8-BIT GAMESYSTEM CONFIG → 進階SYSTEM CONFIG」中修改了本機庫路徑選項，請你修改回預設模式。\n如果你正在使用預設模式，請檢查8-BIT GAME目錄路徑是否只包含英文字母、數字和底線。\n如果是，那麼請檢查是否為EXPANSION CHIP或 ZeroLauncher 引起的本機庫缺失的問題。如果你OK [A]是 ZeroLauncher 引起的，建議你向我們回報。\n<b>對於 Windows 使用者，你還可以嘗試在「控制台 → 時鐘和區域 → 地區 → 系統管理 → 變更系統區域SYSTEM CONFIG」中，關閉「Beta：使用 Unicode UTF-8 提供全球語言支援」選項；</b>\n<b>或將8-BIT GAME目錄路徑中的所有非英文字母的名稱 (例如中文、空格等) 修改為英文字母。</b>\n如果你確實需要自訂本機庫路徑，你需要保證其中包含缺失的本機庫！
