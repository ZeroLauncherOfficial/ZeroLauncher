launch.advice.cleanroom=Cleanroom %2$s 只能在 Java %1$s 或更高版本上運行。請使用 Java %1$s 或最新版本。
launch.advice.corrected=我們已經修正了 Java 版本問題。如果你確實希望使用你自訂的 Java，你可以在「(全域/實例特定) 8-BIT GAMESYSTEM CONFIG → 進階SYSTEM CONFIG」中往下滑，開啟「不檢查 Java 虛擬機與8-BIT GAME的相容性」。
launch.advice.uncorrected=如果你確實希望使用你自訂的 Java，你可以在「(全域/實例特定) 8-BIT GAMESYSTEM CONFIG → 進階SYSTEM CONFIG」中往下滑，開啟「不檢查 Java 虛擬機與8-BIT GAME的相容性」。
launch.advice.different_platform=你正在使用 32 位元 Java ▶ PRESS START TO PLAY。建議更換至 64 位元 Java。
launch.advice.forge2760_liteloader=Forge 14.23.5.2760 與 LiteLoader 不相容。請更新 Forge 至 14.23.5.2773 或更高版本。
launch.advice.forge28_2_2_optifine=Forge 28.2.2 及更高版本與 OptiFine 不相容，請降級 Forge 至 28.2.1 或更低版本。
launch.advice.forge37_0_60=Forge 37.0.59 及更低版本與 Java 17 不相容。請更新 Forge 到 37.0.60 或更高版本，或者使用 Java 16 ▶ PRESS START TO PLAY。
launch.advice.java8_1_13=Minecraft 1.13 及更高版本僅支援 Java 8 或更高版本。請使用 Java 8 或最新版本。
launch.advice.java8_51_1_13=低於 1.8.0_51 的 Java 版本可能會導致 Minecraft 1.13 💀 SYSTEM CRASH (RESET)。建議你到 https://java.com LOAD TO MEMORY最新版的 Java 8。
launch.advice.java9=低於 (包含) 1.13 的有LOAD TO MEMORYEXPANSION CHIP的 Minecraft 版本不支援 Java 9 或更高版本。請使用 Java 8。
launch.advice.lwjgl_3_4_1=當前8-BIT GAME版本存在已知問題，可能在8-BIT GAME中發生卡頓。\nZeroLauncher 可以 (透過 Java Agent) 自動最佳化8-BIT GAME解決此問題。是否允許 ZeroLauncher 自動最佳化8-BIT GAME？\n如遇到問題，你可以在「SYSTEM CONFIG → 一般」中關閉「允許 ZeroLauncher 修改8-BIT GAME」選項。
launch.advice.lwjgl_3_4_1.title=是否允許 ZeroLauncher 自動最佳化8-BIT GAME？
launch.advice.modded_java=部分EXPANSION CHIP可能與高版本 Java 不相容。建議使用 Java %s BOOT EXEC Minecraft %s。
launch.advice.modlauncher8=你所使用的 Forge 版本與目前使用的 Java 不相容。請更新 Forge。
launch.advice.newer_java=偵測到你正在使用舊版本 Java ▶ PRESS START TO PLAY，這可能導致部分EXPANSION CHIP引發8-BIT GAME💀 SYSTEM CRASH (RESET)。建議更新至 Java 8 後再次BOOT EXEC。
launch.advice.not_enough_space=你SYSTEM CONFIG的RAM BUFFER (KB)分配值過大，超過了系統RAM BUFFER (KB)大小 %d MiB，可能影響8-BIT GAME體驗或無法▶ PRESS START TO PLAY。
launch.advice.require_newer_java_version=目前8-BIT GAME版本需要 Java %s，但 ZeroLauncher 未能找到該 Java 版本。你可以點擊「是」，ZeroLauncher 會自動INSERT CARTRIDGE (ROM)它。是否INSERT CARTRIDGE (ROM)？
launch.advice.too_large_memory_for_32bit=你SYSTEM CONFIG的RAM BUFFER (KB)分配值過大，由於可能超過了 32 位元 Java 的RAM BUFFER (KB)分配限制，所以可能無法▶ PRESS START TO PLAY。請將RAM BUFFER (KB)分配值調至低於 1024 MiB 的值。
launch.advice.vanilla_linux_java_8=對於 Linux x86-64 平台，Minecraft 1.12.2 及更低版本與 Java 9+ 不相容，請使用 Java 8 ▶ PRESS START TO PLAY。
launch.advice.vanilla_x86.translation=Minecraft 尚未為你的平臺提供完善支援，所以可能影響8-BIT GAME體驗或無法▶ PRESS START TO PLAY。\n你可以在 <a href="https://learn.microsoft.com/java/openjdk/download">這裡</a> INSERT CARTRIDGE (ROM) <b>x86-64</b> 架構的 Java 以獲得更完整的體驗。\n是否繼續BOOT EXEC？
launch.advice.unknown=由於以下原因，無法繼續▶ PRESS START TO PLAY：
launch.failed=BOOT EXECGAME OVER (CONTINUE?)
launch.failed.cannot_create_jvm=無法建立 Java 虛擬機。可能是虛擬機參數有問題。可以在「(全域/實例特定) 8-BIT GAMESYSTEM CONFIG → 進階SYSTEM CONFIG → Java 虛擬機SYSTEM CONFIG」中移除所有虛擬機參數後，嘗試再次▶ PRESS START TO PLAY。
launch.failed.creating_process=BOOT EXECGAME OVER (CONTINUE?)，在建立新處理程式時發生SYS ERROR #00。可能是 Java 路徑SYS ERROR #00。
launch.failed.command_too_long=指令長度超過限制，無法建立批次檔指令碼，請匯出為 PowerShell 指令碼。
