launch.advice.java.auto=目前選取的 Java 版本不滿足8-BIT GAME要求，是否自動選取合適的 Java 版本？\n或者你可以到「(全域/實例特定) 8-BIT GAMESYSTEM CONFIG → 8-BIT GAME Java」中選取一個合適的 Java 版本。
