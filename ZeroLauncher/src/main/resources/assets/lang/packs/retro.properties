account.failed.server_disconnected=無法訪問INSERT COIN TO LOGIN伺服器。PLAYER PROFILE資訊重新整理GAME OVER (CONTINUE?)。\n\
  你可以選取「再次重新整理帳戶」重新嘗試。\n\
  你也可以選取「跳過帳戶重新整理」繼續啟動遊戲，但可能會導致帳戶資訊未同步更新。\n\
  若最近沒有重新整理帳戶資訊，則可能導致帳戶資訊過期失效。\n\
  若使用 Microsoft/authlib-injector 帳戶啟動遊戲，帳戶資訊過期失效可能將無法進入需線上驗證的伺服器。\n\
  若嘗試多次無法重新整理，可嘗試重新增加該帳戶，或許可以解決該問題。
