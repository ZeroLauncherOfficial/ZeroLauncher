name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish GitHub Release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Build ShadowJar
        run: ./gradlew shadowJar

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroLauncher-artifacts
          path: |
            ZeroLauncher/build/libs/*.jar
            ZeroLauncher/build/libs/*.sha*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ZeroLauncher/build/libs/*.jar
            ZeroLauncher/build/libs/*.sha*
          generate_release_notes: true
          draft: false
          prerelease: false
